<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperion</title>
  <style>
    :root {
      --bg: #111214;
      --bg-alt: #17181b;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --accent: #ffd000;
      --accent-dark: #800000;
      --good: #4caf50;
      --bad: #f44336;
      --border: #2a2b2f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header.hero {
      text-align: center;
      padding: 70px 20px 50px;
      background: linear-gradient(180deg, var(--bg-alt), var(--bg));
    }

    header.hero h1 {
      font-size: 2.6rem;
      margin: 10px 0 6px;
      letter-spacing: 1px;
    }

    header.hero h1 span {
      color: var(--accent);
    }

    header.hero p.copy {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .logo-mark {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: conic-gradient(from 210deg, var(--accent), var(--accent-dark), var(--accent));
      margin: 0 auto 20px;
    }

    section {
      padding: 50px 0;
      border-top: 1px solid var(--border);
    }

    h2 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 30px;
    }

    .feature-row {
      display: flex;
      gap: 40px;
      align-items: center;
      flex-wrap: wrap;
    }

    .feature-row>div {
      flex: 1 1 300px;
    }

    .feature-row.reverse {
      flex-direction: row-reverse;
    }

    .feature-row h3 {
      margin-top: 0;
    }

    .feature-row .placeholder-media {
      aspect-ratio: 16/9;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    /* ---- パフォーマンス比較バー ---- */
    .performance-block {
      margin-bottom: 36px;
    }

    .performance-badge {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .performance-badge-number {
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: 700;
    }

    .bar-row {
      margin: 8px 0;
    }

    .bar-track {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 18px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--muted);
    }

    .bar-fill.hyperion {
      background: var(--accent);
    }

    .bar-caption {
      font-size: .85rem;
      color: var(--muted);
    }

    /* ---- 比較表 ---- */
    .table-wrap {
      overflow-x: auto;
    }

    table.comparison {
      width: 100%;
      border-collapse: collapse;
      font-size: .95rem;
    }

    table.comparison th,
    table.comparison td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: center;
    }

    table.comparison th:first-child,
    table.comparison td:first-child {
      text-align: left;
    }

    table.comparison thead th {
      background: var(--bg-alt);
    }

    table.comparison td.hyperion,
    table.comparison th.hyperion {
      background: rgba(124, 92, 255, .12);
    }

    table.comparison td.best {
      font-weight: 700;
    }

    .icon-yes {
      color: var(--good);
    }

    .icon-no {
      color: var(--bad);
    }

    .versions {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .version-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      flex: 1 1 260px;
      text-align: center;
    }

    .version-card h3 {
      font-size: 1.8rem;
      margin: 6px 0;
    }

    .btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 22px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .btn:hover {
      background: var(--accent-dark);
    }

    footer {
      padding: 30px 0;
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="logo-mark"></div>
    <h1>Hyper<span>ion</span></h1>
  </header>

  <section>
    <div class="container feature-row">
      <div class="placeholder-media" style="aspect-ratio:16/9; padding:0;">
        <iframe width="100%" height="100%" src="https://www.youtube.com/embed/vCrMwjD7HhU" title="Hyperion demo"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen style="border-radius:12px;">
        </iframe>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div id="performance-root"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <h2>Comparison with other players</h2>
      <div class="table-wrap">
        <table class="comparison" id="comparison-root"></table>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <h2>Download</h2>
      <div class="versions" id="versions-root"></div>
    </div>
  </section>

  <footer>
    <div class="container">
      <a href="Mixer.html"
        style="color:var(--muted); text-decoration:none; font-size:.9rem; border:1px solid var(--border); padding:6px 14px; border-radius:20px; display:inline-block; margin-bottom:16px;">🎨
        Try the Color Mixer</a>
      <div>© 2026 Hyperion Project</div>
    </div>
  </footer>

  <script>
    /* =====================================================================
       ▼▼▼ DATA SECTION STARTS HERE ▼▼▼
       Edit the numbers and labels below, and the sections above update automatically.
       ===================================================================== */

    // --- Performance comparison (bar charts) ---
    // Bar widths are automatically scaled relative to the largest value in each group.
    const performanceData = [
      {
        title: "MIDI loading speed",
        number: "16.94",
        unit: "x",
        suffix: "faster MIDI loading",
        unit_label: "seconds (lower is better)",
        bars: [
          { name: "Hyperion", value: 3.5, isSelf: true },
          { name: "Wasabi", value: 4.0 },
          { name: "PFA (baseline)", value: 59.3 },
        ]
      },
      {
        title: "Memory usage",
        number: "2.74",
        unit: "x",
        suffix: "less memory usage",
        unit_label: "MiB (lower is better)",
        bars: [
          { name: "Wasabi", value: 1821 },
          { name: "Hyperion", value: 2888, isSelf: true },
          { name: "PFA (baseline)", value: 7927 },
        ],
        note: "Loading performance for a single MIDI file with 31 million notes, measured on a Ryzen 5 5625U (6-core, 2.3GHz) PC. Comparisons are for reference only."
      },
    ];

    // --- Detailed comparison table ---
    // Columns with hyperion:true are highlighted.
    const comparisonTable = {
      columns: [
        { key: "pfa", label: "PFA" },
        { key: "hyperion", label: "Hyperion", hyperion: true },
        { key: "wasabi", label: "Wasabi" },
      ],
      rows: [
        {
          label: "MIDI loading speed",
          values: { pfa: "Slow", hyperion: "Fast", wasabi: "Fast" },
        },
        {
          label: "Performance",
          values: { pfa: "Heavy", hyperion: "Lightweight", wasabi: "Lighter" },
        },
        {
          label: "Memory usage<br><small>Estimated per-note usage (64-bit)</small>",
          values: { pfa: "59 bytes", hyperion: "43 bytes", wasabi: "29 bytes" },
          best: "wasabi"
        },
        {
          label: "Can change note appearance",
          values: { pfa: "no", hyperion: "yes", wasabi: "yes" },
          best: "hyperion,wasabi"
        },
        {
          label: "Number of settings",
          values: { pfa: "Few", hyperion: "Many", wasabi: "Moderate" },
          best: "hyperion"
        },
      ]
    };

    // --- Download version info ---
    const versions = [
      {
        name: "Latest",
        number: "1.1.0-Beta",
        date: "2026-09-09",
        sizeText: "17.8MiB",
        url: "https://github.com/FRSK1214/Hyperion/releases/latest",
        highlight: true
      },
    ];

    /* =====================================================================
       ▲▲▲ DATA SECTION ENDS HERE ▲▲▲
       Everything below is rendering logic. You normally don't need to edit it.
       ===================================================================== */

    function iconYes() {
      return '<span class="icon-yes">✔ Yes</span>';
    }
    function iconNo() {
      return '<span class="icon-no">✘ No</span>';
    }
    function cellContent(v) {
      if (v === "yes") return iconYes();
      if (v === "no") return iconNo();
      return v;
    }

    function renderPerformance() {
      const root = document.getElementById("performance-root");
      root.innerHTML = performanceData.map(block => {
        const max = Math.max(...block.bars.map(b => b.value));
        const barsHtml = block.bars.map(b => {
          const pct = (b.value / max) * 100;
          const fillClass = b.isSelf ? "bar-fill hyperion" : "bar-fill";
          return `
        <div class="bar-row">
          <div class="bar-track"><div class="${fillClass}" style="width:${pct}%"></div></div>
          <div class="bar-caption">${b.name}: ${b.value}</div>
        </div>`;
        }).join("");
        const note = block.note ? `<small class="bar-caption">${block.note}</small>` : "";
        return `
      <div class="performance-block">
        <div class="performance-badge">
          <span class="performance-badge-number">${block.number}</span><span>${block.unit}</span>
          ${block.suffix}
        </div>
        ${barsHtml}
        ${note}
      </div>`;
      }).join("");
    }

    function renderComparisonTable() {
      const root = document.getElementById("comparison-root");
      const cols = comparisonTable.columns;

      const thead = `
    <thead>
      <tr>
        <th></th>
        ${cols.map(c => `<th class="${c.hyperion ? "hyperion" : ""}">${c.label}</th>`).join("")}
      </tr>
    </thead>`;

      const tbody = `
    <tbody>
      ${comparisonTable.rows.map(row => {
        const bestKeys = (row.best || "").split(",").map(s => s.trim());
        const cells = cols.map(c => {
          const isBest = bestKeys.includes(c.key);
          const classes = [
            c.hyperion ? "hyperion" : "",
            isBest ? "best" : ""
          ].filter(Boolean).join(" ");
          return `<td class="${classes}">${cellContent(row.values[c.key])}</td>`;
        }).join("");
        return `<tr><th>${row.label}</th>${cells}</tr>`;
      }).join("")}
    </tbody>`;

      root.innerHTML = thead + tbody;
    }

    function renderVersions() {
      const root = document.getElementById("versions-root");
      root.innerHTML = versions.map(v => `
    <div class="version-card">
      <div>${v.name}</div>
      <h3>${v.number}</h3>
      <div style="color:var(--muted)">Released ${v.date}</div>
      <a class="btn" href="${v.url}">Download <small>(${v.sizeText})</small></a>
    </div>
  `).join("");
    }

    renderPerformance();
    renderComparisonTable();
    renderVersions();
  </script>
</body>

</html>
